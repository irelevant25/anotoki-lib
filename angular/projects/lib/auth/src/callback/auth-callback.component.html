@if (message(); as said) {
    <section class="callback" [attr.lang]="text().lang">
        <p class="message" role="alert">{{ said }}</p>
        <div class="actions">
            <button type="button" class="button primary" [disabled]="busy()" (click)="retry()">{{ text().words.retry }}</button>
            @if (failure()?.code !== "unavailable") {
                <button type="button" class="button" (click)="back()">{{ text().words.back }}</button>
            }
        </div>
    </section>
} @else {
    <section class="callback" role="status" [attr.lang]="text().lang">
        <p class="message">{{ text().words.signingIn }}</p>
    </section>
}
