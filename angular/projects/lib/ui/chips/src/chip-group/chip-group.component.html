<div class="anotoki-field">
    <span class="anotoki-field__label" [id]="labelId" [class.anotoki-visually-hidden]="hideLabel()">
        <span>{{ label() }}</span>
        @if (optional()) {
            <!-- A space between the two, for the group's name: "Lessons optional", in every browser's reading. -->
            &ngsp;
            <span class="anotoki-field__optional" [attr.lang]="words.foreignLang()">{{ words.t("ui.optional") }}</span>
        }
    </span>
    <div
        class="anotoki-chip-group__chips"
        [attr.role]="multiple() ? 'group' : 'radiogroup'"
        [attr.aria-labelledby]="labelId"
        [attr.aria-describedby]="describedBy()"
        [attr.aria-required]="!multiple() && required() ? 'true' : null"
        [attr.aria-invalid]="!multiple() && isInvalid() ? 'true' : null"
        (keydown)="onKeydown($event)">
        @for (option of options(); track option.value) {
            <button
                anotokiChip
                class="anotoki-chip-group__chip"
                [attr.role]="multiple() ? null : 'radio'"
                [pressed]="multiple() ? chosen(option) : null"
                [checked]="multiple() ? null : chosen(option)"
                [disabled]="disabled() || !!option.disabled"
                [attr.aria-label]="option.name || null"
                [attr.data-value]="option.value"
                [tabIndex]="multiple() || option.value === focusable() ? 0 : -1"
                (click)="press(option)">
                @if (option.icon) {
                    <anotoki-icon [name]="option.icon" [size]="15" />
                }
                <span class="anotoki-chip-group__label" [attr.lang]="option.lang || null">{{ option.label }}</span>
                @if (option.note !== undefined && option.note !== null && option.note !== "") {
                    <!-- A space before the note, for the chip's name: "Apprentice 12" (the row's gap draws it). -->
                    &ngsp;
                    <span class="anotoki-chip-group__note">{{ option.note }}</span>
                }
            </button>
        }
    </div>
    @if (hint() && !error()) {
        <p class="anotoki-field__hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="anotoki-field__error" [id]="errorId" role="alert">
            <anotoki-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
