<dialog #dialog class="drawer" [attr.aria-labelledby]="headingId" (cancel)="onCancel($event)" (keydown)="onKeydown($event)" (pointerdown)="pointerDownTarget = $event.target" (click)="onClick($event)">
    <div class="panel">
        <header class="head">
            <div class="head-row">
                @if (backLabel()) {
                    <button type="button" class="back" (click)="back.emit()">
                        <anotoki-icon name="arrowLeft" [size]="16" />
                        {{ backLabel() }}
                    </button>
                } @else {
                    <span></span>
                }
                <button type="button" class="close" [attr.aria-label]="words.t('ui.close')" [attr.title]="words.t('ui.close')" [attr.lang]="words.foreignLang()" (click)="dismiss.emit()">
                    <anotoki-icon name="x" [size]="18" />
                </button>
            </div>
            <h2 #title class="title" tabindex="-1" [id]="headingId">{{ heading() }}</h2>
            @if (subheading()) {
                <p class="subtitle">{{ subheading() }}</p>
            }
            <div class="actions"><ng-content select="[drawerActions]" /></div>
        </header>
        <div #body class="body">
            <ng-content />
        </div>
        <footer class="foot"><ng-content select="[drawerFooter]" /></footer>
    </div>
</dialog>
