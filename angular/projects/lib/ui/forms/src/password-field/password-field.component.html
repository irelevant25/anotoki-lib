<div class="field">
    <div class="label">
        <label [for]="inputId" [class.visually-hidden]="hideLabel()">
            {{ label() }}
            @if (optional()) {
                <span class="optional" [attr.lang]="words.foreignLang()">{{ words.t("ui.optional") }}</span>
            }
        </label>
        <ng-content select="[labelAside]" />
    </div>
    <div class="control" [class.is-invalid]="!!error()" [class.is-disabled]="disabled()">
        <input
            #control
            class="input"
            [id]="inputId"
            [attr.name]="name() || null"
            [type]="visible() ? 'text' : 'password'"
            [value]="value()"
            [attr.autocomplete]="autocomplete()"
            [attr.maxlength]="maxlength()"
            [attr.aria-invalid]="error() ? 'true' : null"
            [attr.aria-describedby]="describedBy()"
            spellcheck="false"
            autocapitalize="off"
            [required]="required()"
            [disabled]="disabled()"
            (input)="onInput($event)" />
        <span class="affix">
            <button
                type="button"
                class="reveal"
                [attr.aria-pressed]="visible()"
                [attr.aria-label]="words.t(visible() ? 'ui.hidePassword' : 'ui.showPassword')"
                [attr.title]="words.t(visible() ? 'ui.hidePassword' : 'ui.showPassword')"
                [attr.lang]="words.foreignLang()"
                [disabled]="disabled()"
                (click)="visible.set(!visible())">
                <anotoki-icon [name]="visible() ? 'eyeOff' : 'eye'" [size]="18" />
            </button>
        </span>
    </div>
    @if (hint() && !error()) {
        <p class="hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="error" [id]="errorId" role="alert">
            <anotoki-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
