<fieldset class="anotoki-radio-group__group" [disabled]="disabled()">
    <legend class="anotoki-radio-group__legend">{{ label() }}</legend>
    <div class="anotoki-radio-group__options">
        @for (option of options(); track option.value) {
            <label class="anotoki-radio-group__option" [class.anotoki-radio-group__option--checked]="option.value === value()">
                <input type="radio" [name]="name" [value]="option.value" [checked]="option.value === value()" (change)="value.set(option.value)" />
                <span class="anotoki-radio-group__text">
                    <span class="anotoki-radio-group__option-label">{{ option.label }}</span>
                    @if (option.hint) {
                        <span class="anotoki-radio-group__option-hint">{{ option.hint }}</span>
                    }
                </span>
            </label>
        }
    </div>
</fieldset>
