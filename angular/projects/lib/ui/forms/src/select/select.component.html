<div class="field">
    <label class="label" [for]="inputId" [class.visually-hidden]="hideLabel()">
        <span>{{ label() }}</span>
        @if (optional()) {
            <span class="optional" [attr.lang]="words.foreignLang()">{{ words.t("ui.optional") }}</span>
        }
    </label>
    <div class="control" [class.is-invalid]="!!error()" [class.is-disabled]="disabled()">
        <select
            #control
            class="input picker"
            [id]="inputId"
            [attr.name]="name() || null"
            [attr.aria-invalid]="error() ? 'true' : null"
            [attr.aria-describedby]="describedBy()"
            [required]="required()"
            [disabled]="disabled()"
            (change)="onChange($event)">
            @if (placeholder() !== null) {
                <option value="" [selected]="value() === ''">{{ placeholder() }}</option>
            }
            @for (option of options(); track option.value) {
                <option [value]="option.value" [selected]="option.value === value()" [disabled]="option.disabled ?? false" [attr.lang]="option.lang ?? null">{{ option.label }}</option>
            }
        </select>
    </div>
    @if (hint() && !error()) {
        <p class="hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="error" [id]="errorId" role="alert">
            <anotoki-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
