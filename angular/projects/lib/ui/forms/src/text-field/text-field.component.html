<div class="field">
    <label class="label" [for]="inputId" [class.visually-hidden]="hideLabel()">
        <span>{{ label() }}</span>
        @if (optional()) {
            <span class="optional" [attr.lang]="words.foreignLang()">{{ words.t("ui.optional") }}</span>
        }
    </label>
    <div class="control" [class.is-invalid]="!!error()" [class.is-disabled]="disabled()">
        <ng-content select="[fieldPrefix]" />
        <input
            #control
            class="input"
            [id]="inputId"
            [attr.name]="name() || null"
            [type]="type()"
            [value]="value()"
            [attr.autocomplete]="autocomplete() || null"
            [attr.inputmode]="inputmode() || null"
            [attr.placeholder]="placeholder() || null"
            [attr.maxlength]="maxlength()"
            [attr.minlength]="minlength()"
            [attr.min]="min()"
            [attr.max]="max()"
            [attr.pattern]="pattern() || null"
            [attr.spellcheck]="spellcheck()"
            [attr.autocapitalize]="autocapitalize() || null"
            [attr.aria-invalid]="error() ? 'true' : null"
            [attr.aria-describedby]="describedBy()"
            [required]="required()"
            [readOnly]="readonly()"
            [disabled]="disabled()"
            (input)="onInput($event)"
            (blur)="blurred.emit()" />
        <ng-content select="[fieldSuffix]" />
    </div>
    @if (hint() && !error()) {
        <p class="hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="error" [id]="errorId" role="alert">
            <anotoki-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
