<div class="anotoki-field">
    <label class="anotoki-field__label" [for]="inputId" [class.anotoki-visually-hidden]="hideLabel()">
        <span>{{ label() }}</span>
        @if (optional()) {
            <span class="anotoki-field__optional" [attr.lang]="words.foreignLang()">{{ words.t("ui.optional") }}</span>
        }
    </label>
    <div class="anotoki-field__control" [class.anotoki-field__control--invalid]="!!error()" [class.anotoki-field__control--disabled]="disabled()">
        <textarea
            #control
            class="anotoki-field__input anotoki-textarea__multiline"
            [id]="inputId"
            [attr.name]="name() || null"
            [value]="value()"
            [attr.rows]="rows()"
            [attr.maxlength]="maxlength()"
            [attr.placeholder]="placeholder() || null"
            [attr.spellcheck]="spellcheck()"
            [attr.aria-invalid]="error() ? 'true' : null"
            [attr.aria-describedby]="describedBy()"
            [required]="required()"
            [readOnly]="readonly()"
            [disabled]="disabled()"
            (input)="onInput($event)"></textarea>
    </div>
    @if (hint() && !error()) {
        <p class="anotoki-field__hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="anotoki-field__error" [id]="errorId" role="alert">
            <anotoki-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
