<nav class="pagination" [attr.aria-label]="words.t('ui.pages')" [attr.lang]="words.foreignLang()">
    <p class="range" aria-live="polite">{{ range() }}</p>
    <div class="buttons">
        <button anotokiButton size="sm" variant="secondary" data-previous [disabled]="page() <= 1 || busy()" (click)="pageChange.emit(page() - 1)">
            <anotoki-icon name="chevronLeft" [size]="15" />
            {{ words.t("ui.previous") }}
        </button>
        <span class="page">{{ words.t("ui.pageOf", { page: page(), pages: pages() }) }}</span>
        <button anotokiButton size="sm" variant="secondary" data-next [disabled]="page() >= pages() || busy()" (click)="pageChange.emit(page() + 1)">
            {{ words.t("ui.next") }}
            <anotoki-icon name="chevronRight" [size]="15" />
        </button>
    </div>
</nav>
