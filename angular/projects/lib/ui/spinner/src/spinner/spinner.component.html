@if (shown()) {
    <span class="anotoki-spinner__spinner" [attr.role]="said() ? 'status' : null" [attr.lang]="lang()">
        <svg [attr.width]="px()" [attr.height]="px()" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle class="anotoki-spinner__track" cx="12" cy="12" r="9.5" fill="none" stroke-width="2.5" />
            <circle class="anotoki-spinner__arc" cx="12" cy="12" r="9.5" fill="none" stroke-width="2.5" stroke-linecap="round" />
        </svg>
        @if (said(); as words) {
            <span class="anotoki-spinner__label" [class.anotoki-visually-hidden]="!showLabel()">{{ words }}</span>
        }
    </span>
}
