@if (link(); as home) {
    <a class="anotoki-brand__brand" [routerLink]="home" [attr.aria-label]="label() || null" [attr.aria-current]="current() ? 'page' : null">
        <ng-container [ngTemplateOutlet]="mark" />
    </a>
} @else {
    <span class="anotoki-brand__brand">
        <ng-container [ngTemplateOutlet]="mark" />
    </span>
}

<!-- The spaces (&ngsp;) between the words are for screen readers and copied text: the flex layout draws none. -->
<ng-template #mark>
    <img class="anotoki-brand__logo" [src]="logo()" alt="" [attr.width]="size()" [attr.height]="size() * 0.835" />
    <span class="anotoki-brand__wordmark" [class.anotoki-brand__wordmark--short]="!showName()" [class.anotoki-brand__wordmark--has-panel]="!!panel()" [attr.lang]="lang()">
        @if (showName()) {
            <span class="anotoki-brand__name">anotoki</span>
            &ngsp;
        }
        @if (area()) {
            <span class="anotoki-brand__area">{{ area() }}</span>
        }
        @if (panel()) {
            &ngsp;
            <span class="anotoki-brand__dot" aria-hidden="true">·</span>
            &ngsp;
            <span class="anotoki-brand__panel">{{ panel() }}</span>
        }
    </span>
</ng-template>
