<a class="anotoki-shell__skip-link" href="#main" [attr.lang]="skipLabel() ? null : words.foreignLang()" (click)="skipTo($event, main)">{{ skip() }}</a>

<ng-content select="[topBar]" />

<div class="anotoki-shell__frame">
    @if (nav().length) {
        <nav class="anotoki-shell__sidenav" [attr.aria-label]="navLabel() || words.t('topbar.sections')">
            <ul>
                @for (item of nav(); track item.link) {
                    <li>
                        <a
                            class="anotoki-shell__nav-link"
                            [routerLink]="item.link"
                            routerLinkActive="anotoki-shell__nav-link--active"
                            [routerLinkActiveOptions]="{ exact: !!item.exact }"
                            ariaCurrentWhenActive="page">
                            @if (item.icon) {
                                <anotoki-icon [name]="item.icon" [size]="18" />
                            }
                            <span>{{ item.label }}</span>
                            @if (item.badge && item.badge !== "0") {
                                <!-- The number is seen; what it counts is heard: "Feedback, 3 new", never "Feedback 3". -->
                                <span class="anotoki-shell__nav-badge" aria-hidden="true">{{ item.badge }}</span>
                                <span class="anotoki-visually-hidden" [attr.lang]="item.badgeLabel ? null : words.foreignLang()">, {{ counted(item) }}</span>
                            }
                        </a>
                    </li>
                }
            </ul>
        </nav>
    }

    <main #main id="main" class="anotoki-shell__content" tabindex="-1">
        <ng-content />
    </main>
</div>

<ng-content select="[shellFooter]" />
