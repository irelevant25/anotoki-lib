<div class="anotoki-translation-cell__grow" [class.anotoki-translation-cell__grow--changed]="changed()" [class.anotoki-translation-cell__grow--invalid]="invalid()" [attr.data-value]="value()">
    <textarea
        class="anotoki-translation-cell__box"
        rows="1"
        spellcheck="true"
        [value]="value()"
        [attr.lang]="language()"
        [attr.aria-label]="label()"
        [attr.placeholder]="placeholder() || null"
        [attr.aria-invalid]="invalid() ? 'true' : null"
        [attr.aria-describedby]="invalid() ? describedBy() : null"
        (input)="onInput($event)"></textarea>
    @if (changed()) {
        <span class="anotoki-translation-cell__mark">Changed</span>
    }
</div>
