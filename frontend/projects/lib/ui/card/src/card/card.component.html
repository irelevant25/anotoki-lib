@if (heading()) {
    <header class="anotoki-card__header">
        <div class="anotoki-card__titles">
            @if (headingLevel() === 3) {
                <h3 class="anotoki-card__title" [id]="headingId() || null">{{ heading() }}</h3>
            } @else {
                <h2 class="anotoki-card__title" [id]="headingId() || null">{{ heading() }}</h2>
            }
            @if (subheading()) {
                <p class="anotoki-card__subtitle">{{ subheading() }}</p>
            }
        </div>
        <div class="anotoki-card__actions"><ng-content select="[cardActions]" /></div>
    </header>
}
<div class="anotoki-card__body">
    <ng-content />
</div>
