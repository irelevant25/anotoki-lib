<dialog
    #dialog
    class="anotoki-dialog__dialog"
    [attr.data-size]="size()"
    [attr.aria-labelledby]="headingId"
    [attr.aria-describedby]="description() ? descriptionId : null"
    [attr.aria-busy]="busy() ? 'true' : null"
    (cancel)="onCancel($event)"
    (keydown)="onKeydown($event)"
    (pointerdown)="pointerDownTarget = $event.target"
    (click)="onClick($event)">
    <div class="anotoki-dialog__panel">
        <header class="anotoki-dialog__header">
            <div class="anotoki-dialog__titles">
                <h2 class="anotoki-dialog__title" [id]="headingId">{{ heading() }}</h2>
                @if (description()) {
                    <p class="anotoki-dialog__description" [id]="descriptionId">{{ description() }}</p>
                }
            </div>
            @if (dismissible()) {
                <button
                    type="button"
                    class="anotoki-dialog__close"
                    [attr.aria-label]="words.t('ui.close')"
                    [attr.title]="words.t('ui.close')"
                    [attr.lang]="words.foreignLang()"
                    [disabled]="busy()"
                    (click)="requestDismiss()">
                    <anotoki-icon name="x" [size]="18" />
                </button>
            }
        </header>
        <div class="anotoki-dialog__body">
            <ng-content />
        </div>
        <footer class="anotoki-dialog__footer"><ng-content select="[dialogFooter]" /></footer>
    </div>
</dialog>
