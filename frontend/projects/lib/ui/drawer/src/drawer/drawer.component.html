<dialog
    #dialog
    class="anotoki-drawer__drawer"
    [attr.aria-labelledby]="headingId"
    (cancel)="onCancel($event)"
    (keydown)="onKeydown($event)"
    (pointerdown)="pointerDownTarget = $event.target"
    (click)="onClick($event)">
    <div class="anotoki-drawer__panel">
        <header class="anotoki-drawer__head">
            <div class="anotoki-drawer__head-row">
                @if (backLabel()) {
                    <button type="button" class="anotoki-drawer__back" (click)="back.emit()">
                        <anotoki-icon name="arrowLeft" [size]="16" />
                        {{ backLabel() }}
                    </button>
                } @else {
                    <span></span>
                }
                <button
                    type="button"
                    class="anotoki-drawer__close"
                    [attr.aria-label]="words.t('ui.close')"
                    [attr.title]="words.t('ui.close')"
                    [attr.lang]="words.foreignLang()"
                    (click)="dismiss.emit()">
                    <anotoki-icon name="x" [size]="18" />
                </button>
            </div>
            <h2 #title class="anotoki-drawer__title" tabindex="-1" [id]="headingId">{{ heading() }}</h2>
            @if (subheading()) {
                <p class="anotoki-drawer__subtitle">{{ subheading() }}</p>
            }
            <div class="anotoki-drawer__actions"><ng-content select="[drawerActions]" /></div>
        </header>
        <div #body class="anotoki-drawer__body">
            <ng-content />
        </div>
        <footer class="anotoki-drawer__foot"><ng-content select="[drawerFooter]" /></footer>
    </div>
</dialog>
