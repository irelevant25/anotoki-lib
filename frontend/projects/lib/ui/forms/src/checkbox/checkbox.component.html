<label class="anotoki-checkbox__checkbox" [class.anotoki-checkbox__checkbox--disabled]="disabled()" [class.anotoki-checkbox__checkbox--invalid]="isInvalid()">
    <input
        #control
        type="checkbox"
        [attr.name]="name() || null"
        [checked]="checked()"
        [disabled]="disabled()"
        [required]="required()"
        [attr.aria-invalid]="isInvalid() ? 'true' : null"
        [attr.aria-describedby]="describedBy()"
        (change)="onChange($event)" />
    <span class="anotoki-checkbox__box" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="12" height="12"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </span>
    <span class="anotoki-checkbox__text">
        <span class="anotoki-checkbox__words"><ng-content /></span>
        @if (hint()) {
            <span class="anotoki-checkbox__hint" [id]="hintId">{{ hint() }}</span>
        }
    </span>
</label>
@if (error()) {
    <p class="anotoki-checkbox__error" [id]="errorId" role="alert">
        <anotoki-icon name="alert" [size]="15" />
        <span>{{ error() }}</span>
    </p>
}
