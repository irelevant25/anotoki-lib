<div class="anotoki-field">
    <label class="anotoki-field__label" [for]="inputId" [class.anotoki-visually-hidden]="hideLabel()">{{ label() }}</label>
    <div
        class="anotoki-code-input__code"
        [class.anotoki-code-input__code--focused]="focused()"
        [class.anotoki-code-input__code--invalid]="isInvalid()"
        [class.anotoki-code-input__code--disabled]="disabled()">
        <div class="anotoki-code-input__cells" aria-hidden="true">
            @for (cell of cells(); track $index) {
                <span class="anotoki-code-input__cell" [class.anotoki-code-input__cell--active]="focused() && $index === activeIndex()" [class.anotoki-code-input__cell--filled]="cell !== ''">
                    {{ cell }}
                </span>
            }
        </div>
        <input
            #control
            class="anotoki-code-input__code-input"
            [id]="inputId"
            [attr.name]="name() || null"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]*"
            spellcheck="false"
            autocapitalize="off"
            [attr.maxlength]="length()"
            [value]="value()"
            [required]="required()"
            [disabled]="disabled()"
            [attr.aria-invalid]="isInvalid() ? 'true' : null"
            [attr.aria-describedby]="describedBy()"
            (input)="onInput($event)"
            (focus)="onFocus()"
            (blur)="focused.set(false)" />
    </div>
    @if (hint() && !error()) {
        <p class="anotoki-field__hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="anotoki-field__error" [id]="errorId" role="alert">
            <anotoki-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
