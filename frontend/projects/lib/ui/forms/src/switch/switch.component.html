<label class="anotoki-switch__switch" [class.anotoki-switch__switch--disabled]="disabled() || busy()">
    <input
        type="checkbox"
        role="switch"
        [attr.name]="name() || null"
        [checked]="checked()"
        [disabled]="disabled() || busy()"
        [attr.aria-busy]="busy() ? 'true' : null"
        [attr.aria-describedby]="hint() ? hintId : null"
        (change)="onChange($event)" />
    <span class="anotoki-switch__track" aria-hidden="true"><span class="anotoki-switch__thumb"></span></span>
    <span class="anotoki-switch__text">
        <span class="anotoki-switch__words"><ng-content /></span>
        @if (hint()) {
            <span class="anotoki-switch__hint" [id]="hintId">{{ hint() }}</span>
        }
    </span>
    @if (busy()) {
        <anotoki-spinner size="sm" />
    }
</label>
