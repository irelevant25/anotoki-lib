@if (isOpen()) {
    <div
        #panel
        class="anotoki-menu__panel"
        role="menu"
        popover="manual"
        [id]="panelId"
        [attr.aria-label]="label() || null"
        [attr.aria-labelledby]="label() ? null : triggerId()"
        [style.min-width.rem]="minWidth()"
        (keydown)="onKeydown($event)"
        (click)="onClick($event)">
        <ng-content />
    </div>
}
