<div class="anotoki-field">
    <label class="anotoki-field__label" [for]="inputId" [class.anotoki-visually-hidden]="hideLabel()">
        <span>{{ label() }}</span>
        @if (optional()) {
            <span class="anotoki-field__optional" [attr.lang]="words.foreignLang()">{{ words.t("ui.optional") }}</span>
        }
    </label>
    <div class="anotoki-field__control" [class.anotoki-field__control--invalid]="isInvalid()" [class.anotoki-field__control--disabled]="disabled()">
        <select
            #control
            class="anotoki-field__input anotoki-select__picker"
            [id]="inputId"
            [attr.name]="name() || null"
            [attr.aria-invalid]="isInvalid() ? 'true' : null"
            [attr.aria-describedby]="describedBy()"
            [required]="required()"
            [disabled]="disabled()"
            (change)="onChange($event)">
            @if (placeholder() !== null) {
                <option value="" [selected]="value() === ''">{{ placeholder() }}</option>
            }
            @for (option of options(); track option.value) {
                <option [value]="option.value" [selected]="option.value === value()" [disabled]="option.disabled ?? false" [attr.lang]="option.lang ?? null">{{ option.label }}</option>
            }
        </select>
    </div>
    @if (hint() && !error()) {
        <p class="anotoki-field__hint" [id]="hintId">{{ hint() }}</p>
    }
    @if (error()) {
        <p class="anotoki-field__error" [id]="errorId" role="alert">
            <anotoki-icon name="alert" [size]="15" />
            <span>{{ error() }}</span>
        </p>
    }
</div>
