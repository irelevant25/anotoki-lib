<div class="page">
    <anotoki-page-header heading="Number field and fieldset" lead="A number as a number - null while the field holds none - between its bounds and in its steps; fields under one name, in columns." />

    <anotoki-fieldset legend="Base stats" hint="At the character's level" [columns]="2" data-stats>
        <anotoki-number-field label="Level" [(value)]="level" [min]="1" [max]="90" hint="From 1 to 90" />
        <anotoki-number-field label="Attack" [(value)]="attack" [min]="0" optional />
        <anotoki-number-field label="Crit rate" [(value)]="critRate" [min]="0" [max]="100" [step]="0.1"><span fieldSuffix>%</span></anotoki-number-field>
        <anotoki-number-field label="Cooldown" [(value)]="cooldown" [min]="0" [step]="0.5"><span fieldSuffix>s</span></anotoki-number-field>
    </anotoki-fieldset>

    <anotoki-fieldset legend="The character" plain [columns]="3">
        <anotoki-text-field label="Name" value="Furina" />
        <anotoki-select label="Rarity" [options]="rarities" [(value)]="rarity" [none]="null" placeholder="Any" />
        <anotoki-text-field label="Level, as a text field" type="number" value="90" [min]="1" [max]="90" [step]="10" />
    </anotoki-fieldset>

    <div class="show-fields__terms">
        <anotoki-checkbox [(checked)]="agreed" required [error]="termsError()" hint="The site's terms of use">I agree to the terms</anotoki-checkbox>
        <button anotokiButton variant="primary" (click)="tried.set(true)">Save</button>
    </div>

    <p class="muted small show-fields__values" data-values>{{ values() }}</p>
</div>
